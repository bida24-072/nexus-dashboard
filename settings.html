<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Nexus SaaS</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">
            <i class="ph ph-hexagon"></i>
            <span class="logo-text">Nexus</span>
        </div>
        <ul class="nav-menu">
            <li class="nav-item">
                <a href="index.html" class="nav-link active">
                    <i class="ph ph-squares-four"></i>
                    <span class="nav-text">Overview</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="analytics.html" class="nav-link">
                    <i class="ph ph-chart-line-up"></i>
                    <span class="nav-text">Analytics</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="settings.html" class="nav-link">
                    <i class="ph ph-gear"></i>
                    <span class="nav-text">Settings</span>
                </a>
            </li>
        </ul>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
        <!-- Topbar -->
        <header class="topbar">
            <div class="search-bar">
                <i class="ph ph-magnifying-glass" style="color: var(--text-muted);"></i>
                <input type="text" placeholder="Search...">
            </div>
            
            <div class="topbar-actions">
                <button class="icon-btn" id="theme-toggle">
                    <i class="ph ph-sun"></i>
                </button>
                <button class="icon-btn">
                    <i class="ph ph-bell"></i>
                </button>
                
                <div class="profile-container">
                    <button class="profile-btn" id="profile-btn">
                        <div class="avatar">JD</div>
                        <span style="display: none;">John Doe</span> <!-- Hide text on mobile -->
                    </button>
                    <div class="dropdown-menu" id="dropdown-menu">
                        <a href="settings.html" class="dropdown-item">
                            <i class="ph ph-user"></i> My Profile
                        </a>
                        <a href="#" class="dropdown-item">
                            <i class="ph ph-credit-card"></i> Billing
                        </a>
                        <a href="#" class="dropdown-item" style="color: var(--danger);">
                            <i class="ph ph-sign-out"></i> Logout
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Dashboard Content -->
       <!-- Main Content for settings.html -->
<main class="content">
    <h1 class="page-title">Account Settings</h1>
    
    <div class="settings-form">
        <h3 style="margin-bottom: 24px; color: var(--text-main);">Profile Information</h3>
        
        <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 30px;">
            <div class="avatar" style="width: 80px; height: 80px; font-size: 2rem;">JD</div>
            <button class="btn" style="background: var(--bg-hover); color: var(--text-main);">Change Avatar</button>
        </div>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" value="John Doe">
        </div>
        
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" value="john.doe@nexus.com">
        </div>
        
        <div class="form-group">
            <label>Company</label>
            <input type="text" value="Acme Corp">
        </div>

        <div class="form-group">
            <label>New Password</label>
            <input type="password" placeholder="Leave blank to keep current">
        </div>

        <button class="btn">Save Changes</button>
    </div>
</main>
    </div>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
