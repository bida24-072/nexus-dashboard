<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Nexus SaaS</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo">
            <i class="ph ph-hexagon"></i>
            <span class="logo-text">Nexus</span>
        </div>
        <ul class="nav-menu">
            <li class="nav-item">
                <a href="index.html" class="nav-link active">
                    <i class="ph ph-squares-four"></i>
                    <span class="nav-text">Overview</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="analytics.html" class="nav-link">
                    <i class="ph ph-chart-line-up"></i>
                    <span class="nav-text">Analytics</span>
                </a>
            </li>
            <li class="nav-item">
                <a href="settings.html" class="nav-link">
                    <i class="ph ph-gear"></i>
                    <span class="nav-text">Settings</span>
                </a>
            </li>
        </ul>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
        <!-- Topbar -->
        <header class="topbar">
            <div class="search-bar">
                <i class="ph ph-magnifying-glass" style="color: var(--text-muted);"></i>
                <input type="text" placeholder="Search...">
            </div>
            
            <div class="topbar-actions">
                <button class="icon-btn" id="theme-toggle">
                    <i class="ph ph-sun"></i>
                </button>
                <button class="icon-btn">
                    <i class="ph ph-bell"></i>
                </button>
                
                <div class="profile-container">
                    <button class="profile-btn" id="profile-btn">
                        <div class="avatar">JD</div>
                        <span style="display: none;">John Doe</span> <!-- Hide text on mobile -->
                    </button>
                    <div class="dropdown-menu" id="dropdown-menu">
                        <a href="settings.html" class="dropdown-item">
                            <i class="ph ph-user"></i> My Profile
                        </a>
                        <a href="#" class="dropdown-item">
                            <i class="ph ph-credit-card"></i> Billing
                        </a>
                        <a href="#" class="dropdown-item" style="color: var(--danger);">
                            <i class="ph ph-sign-out"></i> Logout
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Dashboard Content -->
       <!-- Main Content for analytics.html -->
<main class="content">
    <h1 class="page-title">Analytics & Reports</h1>
    
    <div class="chart-card" style="margin-bottom: 24px;">
        <h3>Monthly Recurring Revenue (MRR)</h3>
        <div class="chart-container" style="height: 400px;">
            <canvas id="revenueChart"></canvas>
        </div>
    </div>

    <div class="metrics-grid">
        <div class="metric-card">
            <div class="metric-header">
                <span>Churn Rate</span>
                <i class="ph ph-user-minus"></i>
            </div>
            <div class="metric-value">1.2%</div>
            <div class="metric-trend trend-down">
                <i class="ph ph-trend-down"></i> -0.4% from last month
            </div>
        </div>
        <div class="metric-card">
            <div class="metric-header">
                <span>Avg. Session Time</span>
                <i class="ph ph-clock"></i>
            </div>
            <div class="metric-value">4m 32s</div>
            <div class="metric-trend trend-up">
                <i class="ph ph-trend-up"></i> +12s from last month
            </div>
        </div>
    </div>
</main>
    </div>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
